# The extension's status for the header badge and each roadmap milestone's state
# (docs/spec.md, sections 3.1 and 3.5). Hand-edited: change it by a pull request when an Etch
# release changes them. The version in the badge is not here; the build fetches it, and fails
# while a milestone the latest release has reached is still `next` (src/lib/content.ts).
extension:
  # "Preview" while the extension was marked `preview` on the Marketplace; "Stable" since 1.0.0.
  status: Stable
  # done, current (the milestone of the latest release) or next.
  milestones:
    M0: done
    M1: done
    M2: done
    M3: done
    M4: done
    '1.0': current
    # Added as next once etch's v2 specification was done (etch#156).
    '2.0': next
