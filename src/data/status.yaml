# The extension's status for the header badge and the hero's What's new pill (docs/spec.md,
# section 3.1). Hand-edited: change it by a pull request when an Etch release changes them. The
# version in the badge is not here; the build fetches it.
extension:
  # "Preview" while the extension was marked `preview` on the Marketplace; "Stable" since 1.0.0.
  status: Stable
  # What the latest minor release brought. The pill shows only while `version` is the latest
  # release's major and minor. `target` is the id of the feature section that shows it
  # (interface-windows, textures-and-meshes, live-game or scripts); while that section is left
  # out for want of loops, the pill links to the release's notes instead.
  whatsNew:
    version: '2.15'
    line: Particle effects such as smoke in the entity preview, and the DLCs' pictures in hovers and previews
    target: textures-and-meshes
